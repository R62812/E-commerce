<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Rushitha's Electronics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    <a href="contact.html">Contact</a>
    <a href="review.html">Review</a>
    <a href="admin.html">Admin</a>
  </nav>

  <header class="hero">
    <h1>Welcome Back!</h1>
    <p>Log in to continue shopping at Rushitha's Electronics.</p>
  </header>

  <main>
    <section class="form-container">
      <form class="auth-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />

        <button type="submit">Login</button>

        <p>Don't have an account? <a href="register.html">Register here</a></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Rushitha's Electronics. All rights reserved.</p>
  </footer>

  <script>
    document.querySelector(".auth-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const username = document.getElementById("username").value.trim().toLowerCase();
      const password = document.getElementById("password").value.trim();

      if (username === "rushitha" && password === "12345") {
        alert("Welcome Admin Rushitha!");
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("currentUser", "rushitha");
        window.location.href = "admin.html";
        return;
      }

      const users = JSON.parse(localStorage.getItem("users")) || [];
      const match = users.find(user => user.username === username && user.password === password);

      if (match) {
        alert("Login successful!");
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("currentUser", username);
        window.location.href = "shop.html";
      } else {
        alert("Invalid credentials. Try again.");
      }
    });
  </script>

  <script src="script.js"></script>
</body>
</html>
