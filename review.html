<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Reviews - Rushitha's Electronics</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #001F3F, #003366);
      color: white;
    }
    nav {
      background: #000;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: #00BFFF;
      margin: 0 15px;
      font-weight: bold;
      text-decoration: none;
    }
    nav a.active {
      color: #00ccff;
      text-decoration: underline;
    }
    .hero {
      text-align: center;
      padding: 40px 20px;
    }
    .review-section {
      max-width: 700px;
      margin: 0 auto;
      background: #062b51;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .review-section h2 {
      text-align: center;
      color: #00BFFF;
    }
    .review-form input,
    .review-form textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }
    .review-form button {
      background: #00BFFF;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .review-form button:hover {
      background: #0088cc;
    }
    .star-rating span {
      font-size: 24px;
      cursor: pointer;
      color: #ccc;
    }
    .star-rating .selected {
      color: gold;
    }
    #reviewList {
      margin-top: 30px;
    }
    .review-item {
      background: #094170;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      position: relative;
    }
    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #e60000;
    }
    footer {
      background: #000;
      color: #ccc;
      text-align: center;
      padding: 10px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    <a href="contact.html">Contact</a>
    <a href="review.html" class="active">Review</a>
    <a href="admin.html">Admin</a>
  </nav>

  <header class="hero">
    <h1>Customer Reviews</h1>
    <p>Share your experience with Rushitha's Electronics!</p>
  </header>

  <main>
    <section class="review-section">
      <h2>📝 Leave a Review</h2>
      <div class="review-form">
        <input type="text" id="reviewName" placeholder="Your Name" required />
        <textarea id="reviewText" rows="3" placeholder="Write your review..." required></textarea>
        <div class="star-rating">
          <span class="star" data-value="1">★</span>
          <span class="star" data-value="2">★</span>
          <span class="star" data-value="3">★</span>
          <span class="star" data-value="4">★</span>
          <span class="star" data-value="5">★</span>
        </div>
        <button onclick="submitReview()">Submit Review</button>
      </div>
      <div id="reviewList"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Rushitha's Electronics. All rights reserved.</p>
  </footer>

  <script>
    const stars = document.querySelectorAll('.star');
    let selectedRating = 0;

    stars.forEach(star => {
      star.addEventListener('click', () => {
        selectedRating = parseInt(star.getAttribute('data-value'));
        updateStars(selectedRating);
      });
    });

    function updateStars(rating) {
      stars.forEach(star => {
        star.classList.remove('selected');
        if (parseInt(star.getAttribute('data-value')) <= rating) {
          star.classList.add('selected');
        }
      });
    }

    function submitReview() {
      const name = document.getElementById('reviewName').value.trim();
      const text = document.getElementById('reviewText').value.trim();

      if (!name || !text || selectedRating === 0) {
        alert("Please fill in all fields and select a rating.");
        return;
      }

      const reviewList = document.getElementById('reviewList');
      const reviewDiv = document.createElement('div');
      reviewDiv.className = 'review-item';

      const content = document.createElement('div');
      content.innerHTML = `<strong>${name}</strong> - Rating: ${selectedRating}★<br><p>${text}</p>`;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', () => {
        reviewDiv.remove();
      });

      reviewDiv.appendChild(content);
      reviewDiv.appendChild(deleteBtn);
      reviewList.prepend(reviewDiv);

      document.getElementById('reviewName').value = '';
      document.getElementById('reviewText').value = '';
      selectedRating = 0;
      updateStars(0);
    }
  </script>
</body>
</html>
