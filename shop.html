<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - Rushitha's Electronics</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .top-nav {
      background-color: black;
      padding: 15px 0;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .top-nav a {
      color: #00bfff;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
      font-size: 1.1rem;
      transition: 0.3s ease;
    }
    .top-nav a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #00bfff;
    }
  </style>
</head>
<body>
  <div class="top-nav">
  <a href="index.html" data-i18n="home">Home</a>
  <a href="shop.html" data-i18n="shop">Shop</a>
  <a href="wishlist.html" data-i18n="wishlist">Wishlist</a>
  <a href="cart.html" data-i18n="cart">Cart</a>
  <a href="login.html" data-i18n="login">Login</a>
  <a href="contact.html" data-i18n="contact">Contact</a>
  <a href="review.html" data-i18n="review">Review</a>

  <!-- 🌐 Language Dropdown -->
  <select id="languageSelect" onchange="changeLanguage(this.value)" class="language-toggle">
    <option value="en">EN</option>
    <option value="hi">हिं</option>
    <option value="te">తె</option>
  </select>
</div>




   <div class="search-container">
  <input type="text" id="searchInput" class="glow-input" placeholder="Search products..." oninput="showSuggestions()">
  <div id="suggestionsBox" class="suggestions-box"></div>
</div>

  <header class="hero">
    <div class="sort-buttons">
      <button onclick="sortByPrice('asc')">Sort: Price Low → High</button>
      <button onclick="sortByPrice('desc')">Sort: Price High → Low</button>
    </div>

    <div class="category-tabs" id="categoryTabs">
      <button onclick="filterByCategory('all')">All</button>
      <button onclick="filterByCategory('Mobile')">Mobiles</button>
      <button onclick="filterByCategory('Laptop')">Laptops</button>
      <button onclick="filterByCategory('Tablet')">Tablets</button>
      <button onclick="filterByCategory('Headphones')">Headphones</button>
      <button onclick="filterByCategory('Speakers')">Speakers</button>
      <button onclick="filterByCategory('Camera')">Camera</button>
      <button onclick="filterByCategory('Accessories')">Accessories</button>
      <button onclick="filterByCategory('Wearables')">Wearables</button>
    </div>

    <div class="flash-sale-timer" id="flashTimer">
      🔥 Flash Deal ends in: <span id="timerText">Loading...</span>
    </div>
  </header>

  <main>
    <div id="shopContainer" class="product-grid"></div>
  </main>

 


  <footer>
    <p>&copy; 2025 Rushitha's Electronics. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
