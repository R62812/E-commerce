  <header class="hero">
    <h1>Admin Dashboard</h1>
    <button onclick="showAddProductForm()">➕ Add New Product</button>
  </header>

  <main>
      <section id="adminProductList" class="product-grid"></section>
  

    <!-- Add/Edit Form -->
    <div id="productForm" style="display:none; padding:20px;">
      <h2 id="formTitle">Add Product</h2>
      <input type="text" id="prodName" placeholder="Product Name" required />
      <input type="number" id="prodPrice" placeholder="Price" required />
      <input type="text" id="prodCategory" placeholder="Category" required />
      <input type="text" id="prodImage" placeholder="Image Path" required />
      <button onclick="saveProduct()">✅ Save</button>
      <button onclick="cancelForm()">❌ Cancel</button>
    </div>
  </main>

  

    <section>
      <h2 style="text-align: center; margin-top: 20px;">Product List</h2>
        <div id="adminProductList" class="product-grid"></div>
    
    </section>
